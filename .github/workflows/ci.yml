name: CI/CD Action

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tower:
    name: Launch on Seqera Platform
    # Don't try to run on forked repos
    if: github.repository == 'seqeralabs/action-tower-launch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment on the PR with the run results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./
        id: aws_run
        continue-on-error: true
        # Use repository secrets for sensitive fields
        with:
          access_token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          pipeline: hello-aws
          workspace_id: ${{ secrets.AWS_TOWER_WORKSPACE_ID }}
          compute_env: ${{ secrets.AWS_TOWER_COMPUTE_ENV }}
          run_name: ${{ github.job }}_${{ github.sha }}
          workdir: ${{ secrets.AWS_S3_BUCKET }}/work/${{ github.sha }}
          api_endpoint: ${{ secrets.PLATFORM_ENDPOINT }}

      - uses: ./
        id: azure_run
        continue-on-error: true
        # Use repository secrets for sensitive fields
        with:
          access_token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          pipeline: hello-azure
          workspace_id: ${{ secrets.AZURE_TOWER_WORKSPACE_ID }}
          compute_env: ${{ secrets.AZURE_TOWER_COMPUTE_ENV }}
          run_name: ${{ github.job }}_${{ github.sha }}
          workdir: ${{ secrets.AZURE_WORK_CONTAINER }}/work/${{ github.sha }}
          api_endpoint: ${{ secrets.PLATFORM_ENDPOINT }}

      - uses: ./
        id: gcp_run
        continue-on-error: true
        # Use repository secrets for sensitive fields
        with:
          access_token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          pipeline: hello-gcp
          workspace_id: ${{ secrets.GCP_TOWER_WORKSPACE_ID }}
          compute_env: ${{ secrets.GCP_TOWER_COMPUTE_ENV }}
          run_name: ${{ github.job }}_${{ github.sha }}
          workdir: ${{ secrets.GCP_BUCKET }}/work/${{ github.sha }}
          api_endpoint: ${{ secrets.PLATFORM_ENDPOINT }}

      - name: Comment PR
        if: always() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ### 🚀 Pipelines launched

            Launch failures are reported here but do not block CI. The Tower CLI log is uploaded as an artifact.

            | Cloud | Status | Workflow ID | Workspace | Run |
            |-------|--------|-------------|-----------|-----|
            | AWS | ${{ steps.aws_run.outcome == 'success' && '✅ Launched' || '❌ Failed' }} | `${{ steps.aws_run.outputs.workflowId || '—' }}` | `${{ steps.aws_run.outputs.workspaceRef || '—' }}` | ${{ steps.aws_run.outputs.workflowUrl || '—' }} |
            | Azure | ${{ steps.azure_run.outcome == 'success' && '✅ Launched' || '❌ Failed' }} | `${{ steps.azure_run.outputs.workflowId || '—' }}` | `${{ steps.azure_run.outputs.workspaceRef || '—' }}` | ${{ steps.azure_run.outputs.workflowUrl || '—' }} |
            | GCP | ${{ steps.gcp_run.outcome == 'success' && '✅ Launched' || '❌ Failed' }} | `${{ steps.gcp_run.outputs.workflowId || '—' }}` | `${{ steps.gcp_run.outputs.workspaceRef || '—' }}` | ${{ steps.gcp_run.outputs.workflowUrl || '—' }} |
          comment-tag: towerrun

      - uses: ./
        id: runfails
        continue-on-error: true
        with:
          pipeline: no_pipeline_exists
          workspace_id: ${{ secrets.TOWER_WORKSPACE_ID }}
          access_token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute_env: ${{ secrets.TOWER_COMPUTE_ENV }}
          run_name: ${{ github.job }}_${{ github.sha }}
          workdir: ${{ secrets.AWS_S3_BUCKET }}/work/${{ github.sha }}

      - name: Check Failure
        if: steps.runfails.outcome == 'success'
        env:
          RUNFAILS_OUTCOME: ${{ steps.runfails.outcome }}
        run: |
          echo "Failed to catch invalid pipeline submission: $RUNFAILS_OUTCOME"
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: ${{ github.job }}_run_json
          path: tower_action_*.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: Tower debug log file
          path: tower_action_*.log
